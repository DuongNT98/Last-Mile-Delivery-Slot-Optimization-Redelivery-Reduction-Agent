[project]
name = "log-c2-034"
version = "0.1.0"
description = "Last-Mile Delivery Slot Optimization & Redelivery Reduction Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the CI test job
# (wheel-only, no local stub fallback). Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# agenticstar-agentcore ships no py.typed marker / stubs for framework.*/shared.* —
# ignore_missing_imports silences the resulting import-untyped noise (the SDK is
# CoE-distributed; a template repo cannot add stubs to it). disallow_subclassing_any
# is part of the strict bundle but is fundamentally incompatible with every node/graph
# class in this template needing to subclass one of those same untyped bases — the
# alternative (disabling strict entirely) would hide real issues in our own code.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# Neither package is a declared dependency of this template (see `dependencies`
# above) — they only show up when mypy is run against a contaminated ambient
# venv (e.g. this workspace's shared .venv) that happens to have them installed
# transitively via unrelated tooling. `follow_imports = "skip"` stops mypy from
# descending into their own stub files (whose syntax can be tied to a newer
# Python/numpy release than this template targets) instead of masking a real
# error in this template's own code.
[[tool.mypy.overrides]]
module = ["requests.*", "numpy.*", "cryptography.*"]
ignore_missing_imports = true
follow_imports = "skip"
