# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see the
# framework's manifest schema documentation for the full contract.
id: "LOG-C2-034"
name: "Last-Mile Delivery Slot Optimization & Redelivery Reduction Agent"
namespace: "log"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. LLM-enhanced: OptimizeReportNode's narrative summary
# calls Azure OpenAI when the secrets below are configured; the deterministic
# rollup (src/services/delivery_service.py) is always the report itself and never
# depends on the LLM — a missing/unresolvable secret degrades silently to the
# rollup with no narrative, but once an LLM IS resolved, a call failure is
# reported as status=error rather than a silently incomplete report (see
# OptimizeReportNode's docstring).
generation_mode: "llm"  # deterministic | llm
industry: "LOG"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.Graph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# AZURE_OPENAI_API_KEY / AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT are
# deliberately NOT under requires.secrets: that field is enforced via
# require_at_compile() (hard-fail if absent, mediator/registry/agent_registry.py) —
# same reasoning the scaffold's own ANTHROPIC_API_KEY comment documents. These
# three are resolved via ctx.secrets.require() inside OptimizeReportNode.execute()
# (src/nodes/optimize_report_node.py resolve_llm()) and degrade to the
# deterministic rollup on any resolution failure; declaring them here would
# contradict that and 503 the whole agent at compile time whenever no key is
# configured yet (true today — no Azure key exists in any environment).
requires:
  secrets: []
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI
